[workspace]
resolver = "2"
members = ["crates/fmspec-core", "crates/fmspec-ir", "crates/fmspec-search", "crates/fmspec-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# native extension は panic を例外に変換するので unwind にする（仕様書 §3.2）。
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
