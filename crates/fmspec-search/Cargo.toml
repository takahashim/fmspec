[package]
name = "fmspec-search"
description = "fmspec の未検証の探索器。証拠を生成するだけで、判定は中核の判定ゲートが返す"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fmspec-core = { path = "../fmspec-core" }
# 訪問済み集合。状態は節点の列にだけ置き、表には添字を入れる。ハッシュは衝突時に状態の一致で確かめる（仕様書 §13）。
hashbrown = { version = "0.17", default-features = false }
rustc-hash = "2.1"

[dev-dependencies]
# 境界ケースのテスト（tests/boundary.rs）がモデルを JSON の IR から読み込む。fmspec-ir は fmspec-core にだけ依存するので循環しない。
fmspec-ir = { path = "../fmspec-ir" }
serde_json = "1"

[lints]
workspace = true
